<div class="container-fluid mt-4">
  <h3 class="mb-4">👤 Mi Perfil</h3>

  <div class="row g-4">

    <!-- Tarjeta de Perfil -->
    <div class="col-md-4">
      <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">
          <img [src]="user.photoUrl || defaultPhoto" alt="Foto de perfil" class="rounded-circle mb-3" width="100" height="100">
          <h5 class="mb-1">{{ user.name }}</h5>
          <p class="text-muted mb-0">{{ user.email }}</p>
          <p class="badge bg-secondary mt-2">{{ user.role }}</p>
        </div>
      </div>

      <div class="mt-3 d-grid">
        <button class="btn btn-outline-secondary">
          <i class="bi bi-image me-2"></i>Cambiar Foto
        </button>
      </div>
    </div>

    <!-- Formulario de Edición -->
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h5 class="card-title mb-4">📝 Editar Perfil</h5>

          <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
            <div class="mb-3">
              <label for="name" class="form-label">Nombre Completo</label>
              <input type="text"
                     class="form-control"
                     id="name"
                     [(ngModel)]="user.name"
                     name="name"
                     required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email"
                     class="form-control"
                     id="email"
                     [(ngModel)]="user.email"
                     name="email"
                     required>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Rol en el Sistema</label>
              <input type="text"
                     class="form-control"
                     id="role"
                     [(ngModel)]="user.role"
                     name="role"
                     readonly>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-success" [disabled]="!profileForm.form.valid">
                <i class="bi bi-save me-2"></i>Guardar Cambios
              </button>
              <button type="button" class="btn btn-outline-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
