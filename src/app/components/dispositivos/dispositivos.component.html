<div class="container py-5">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <!-- Título -->
      <h4 class="fw-bold mb-4 text-primary">Administrar Sensores IoT</h4>

      <!-- Botón nuevo dispositivo -->
      <button class="btn btn-success mb-3" (click)="nuevoDispositivo()">
        <i class="bi bi-plus-circle me-2"></i> Registrar Sensor
      </button>

      <!-- Tabla de sensores -->
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Ubicación</th>
              <th>Valor</th>
              <th>Unidad</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let dispositivo of dispositivos">
              <td>{{ dispositivo.id }}</td>
              <td>{{ dispositivo.name }}</td>
              <td>{{ dispositivo.location }}</td>
              <td>{{ dispositivo.value }}</td>
              <td>{{ dispositivo.unit }}</td>
              <td>
                <span class="badge" [ngClass]="{
                        'bg-success': dispositivo.status === 'normal',
                        'bg-warning': dispositivo.status === 'warning',
                        'bg-danger': dispositivo.status === 'danger'
                      }">
                  {{ getStatusText(dispositivo.status) }}
                </span>
              </td>
              <td>
                <button class="btn btn-primary btn-sm me-2">
                  <i class="bi bi-pencil"></i> Editar
                </button>
                <button class="btn btn-danger btn-sm">
                  <i class="bi bi-trash"></i> Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Formulario de registro/edición -->
      <div *ngIf="formVisible" class="mt-4">
        <h5>{{ editando ? 'Editar Sensor' : 'Registrar Sensor' }}</h5>
        <form (ngSubmit)="guardarDispositivo()" #form="ngForm">

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" [(ngModel)]="dispositivoSeleccionado.name" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Ubicación</label>
            <input type="text" [(ngModel)]="dispositivoSeleccionado.location" name="location" class="form-control"
              required>
          </div>

          <div class="mb-3">
            <label class="form-label">Valor</label>
            <input type="number" [(ngModel)]="dispositivoSeleccionado.value" name="value" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Unidad</label>
            <input type="text" [(ngModel)]="dispositivoSeleccionado.unit" name="unit" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Estado</label>
            <select [(ngModel)]="dispositivoSeleccionado.status" name="status" class="form-select">
              <option value="normal">Normal</option>
              <option value="warning">Advertencia</option>
              <option value="danger">Crítico</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary me-2">
            {{ editando ? 'Guardar Cambios' : 'Registrar' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
        </form>
      </div>

    </div>
  </div>
</div>
