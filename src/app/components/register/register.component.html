<div class="d-flex align-items-center justify-content-center vh-100 bg-light mt-4">
  <div class="card shadow-sm border-0 w-100" style="max-width: 500px;">
    <div class="card-body p-4">

      <!-- Logo o título -->
      <div class="text-center mb-4">
        <img src="assets/img/logo.png" alt="Logo AgroSensor" width="60" class="mb-3">
        <h4 class="fw-bold">Crear Cuenta</h4>
        <p class="text-muted">Ingresa tus datos para registrarte</p>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="onRegister()" #registerForm="ngForm">

        <!-- <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" class="form-control form-control-lg" id="username" placeholder="Nombre de usuario"
            [(ngModel)]="user.username" name="username" required>
        </div> -->

        <div class="mb-3">
          <label for="name" class="form-label">Nombres y Apellidos</label>
          <input type="text" class="form-control form-control-lg" id="name" placeholder="Tus nombres completos"
            [(ngModel)]="user.fullName" name="name" required>
        </div>


        <div class="mb-3">
          <label for="phone" class="form-label">Número de Teléfono</label>
          <input type="tel" class="form-control form-control-lg" id="phone" placeholder="Ej. 987654321"
            [(ngModel)]="user.phone" name="phone" pattern="[0-9]{9}" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control form-control-lg" id="email" placeholder="tu@email.com"
            [(ngModel)]="user.email" name="email" required>
        </div>

        <!-- <div class="mb-3">
          <label for="role" class="form-label">Cargo (ROL)</label>
          <select class="form-select form-select-lg" id="role" [(ngModel)]="user.role" name="role" required>
            <option value="">Selecciona un rol</option>
            <option value="admin">Administrador</option>
            <option value="agricultor">Agricultor</option>
            <option value="tecnico">Técnico</option>
          </select>
        </div> -->

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control form-control-lg" id="password" placeholder="Mínimo 6 caracteres"
            [(ngModel)]="user.password" name="password"  required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" [(ngModel)]="user.acceptTerms" name="acceptTerms"
            required>
          <label class="form-check-label" for="terms">
            Acepto los términos y condiciones
          </label>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100" [disabled]="!registerForm.form.valid">
          <i class="bi bi-person-plus me-2"></i>Registrarme
        </button>
      </form>

      <!-- Registro -->
      <div class="mt-4 text-center">
        <p class="mb-0">¿Ya tienes cuenta? <a [routerLink]="['/']" class="text-decoration-none fw-bold">Inicia
            Sesión</a></p>
      </div>

      <div class="text-center my-3">
        <p class="text-muted">O regístrate con</p>
        <button class="btn btn-outline-primary me-2" type="button">
          <i class="bi bi-facebook"></i> Facebook
        </button>
        <button class="btn btn-outline-danger" type="button">
          <i class="bi bi-google"></i> Google+
        </button>
      </div>



    </div>
  </div>
</div>
