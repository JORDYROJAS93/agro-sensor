<div class="d-flex align-items-center justify-content-center mt-4 vh-100 bg-light">
  <div class="card shadow-sm border-0 w-100" style="max-width: 400px;">
    <div class="card-body p-4">

      <!-- Logo o título -->
      <div class="text-center mb-4">
        <img src="assets/img/logo.png" alt="Logo AgroSensor" width="60" class="mb-3">
        <h4 class="fw-bold">Sistema Agrícola Inteligente</h4>
        <p class="text-muted">Inicia sesión para continuar</p>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" class="form-control form-control-lg" id="username" placeholder="Tu nombre de usuario"
            [(ngModel)]="email" name="username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control form-control-lg" id="password" placeholder="Tu contraseña"
            [(ngModel)]="password" name="password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" name="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Recordarme
            </label>
          </div>

          <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>
      </form>

      <!-- Registro -->
      <div class="mt-4 text-center">
        <p class="mb-0">¿No tienes cuenta? <a [routerLink]="['/register']"
            class="text-decoration-none fw-bold">Regístrate</a></p>
      </div>

      <div class="text-center my-3">
        <p class="text-muted">O inicia sesión con</p>
        <button class="btn btn-outline-primary me-2" type="button">
          <i class="bi bi-facebook"></i> Facebook
        </button>
        <button class="btn btn-outline-danger" type="button">
          <i class="bi bi-google"></i> Google+
        </button>
      </div>



    </div>
  </div>
</div>
